name: Deploy & Publish MIEWeb Auth (mieauth.mieweb.org)

# ─────────────────────────────────────────────────────────
# Deployment for the MIE-internal instance at mieauth.mieweb.org.
# The server builds on the mie-fwdc-auth1 self-hosted runner; the
# mobile apps go through the shared mieweb/actions pipeline.
#
# This is NOT the opensource app — that stays on
# mieauth-prod.os.mieweb.org via deploy-and-publish-miewebauth-prod-os.yml, and
# keeps the com.mieweb.mieauth / org.mieweb.opensource IDs.
#
# Triggers:
#   - releases tagged mie-v*
#   - manual dispatch (server-only by default)
# ─────────────────────────────────────────────────────────
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: false
        default: development
      include_mobile:
        description: "Also build and publish the mobile apps"
        type: boolean
        required: false
        default: false
      platforms:
        description: "Mobile platforms to build"
        type: choice
        options: [both, ios, android]
        required: false
        default: both
      publish:
        description: "Upload to TestFlight / Play Store (off = build only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  SERVER_URL: https://mieauth.mieweb.org
  SERVER_HOST: mieauth.mieweb.org

jobs:
  # ─────────────────────────────────────────────
  # Gate: release must use the mie-v* prefix.
  # Manual dispatch always proceeds.
  # ─────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      build_mobile: ${{ steps.check.outputs.build_mobile }}
      app_version: ${{ steps.check.outputs.app_version }}
      build_date: ${{ steps.check.outputs.build_date }}
      platforms: ${{ steps.check.outputs.platforms }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Check trigger and resolve version
        id: check
        run: |
          BUILD_DATE=$(date +%m-%d-%Y)
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "build_mobile=${{ inputs.include_mobile }}" >> "$GITHUB_OUTPUT"
            echo "platforms=${{ inputs.platforms }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
            echo "app_version=" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — proceeding (mobile: ${{ inputs.include_mobile }})"
            exit 0
          fi

          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" == mie-v* ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "build_mobile=true" >> "$GITHUB_OUTPUT"
            echo "platforms=both" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            # mie-v1.2.3 -> 1.2.3
            echo "app_version=${TAG#mie-v}" >> "$GITHUB_OUTPUT"
            echo "Tag '${TAG}' matches mie-v* — proceeding"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "build_mobile=false" >> "$GITHUB_OUTPUT"
            echo "platforms=both" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag '${TAG}' is not a mie-v* tag — skipping"
          fi

  # ─────────────────────────────────────────────
  # Server — builds locally on mie-fwdc-auth1
  # ─────────────────────────────────────────────
  deploy-server:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build and Restart MIEAuth
        run: |
          set -e

          echo "=== Generating build info ==="
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          node generate-build-info.js

          echo "=== Installing project dependencies ==="
          export PATH="$HOME/.meteor:$PATH"
          meteor npm install

          echo "=== Building Meteor server ==="
          # 4 GB container — cap the build heap so the tool is not OOM-killed.
          export TOOL_NODE_FLAGS="--max-old-space-size=3072"
          BUILD_DIR="$HOME/Builds/Webserver-build-$(date +%m-%d-%Y-%H%M%S)"
          meteor build "${BUILD_DIR}" \
            --directory \
            --server-only \
            --server="${SERVER_URL}"

          echo "=== Installing bundle server dependencies ==="
          cd "${BUILD_DIR}/bundle/programs/server"
          npm install

          echo "=== Installing bundle-level dependencies ==="
          cd "${BUILD_DIR}/bundle"
          npm install @babel/runtime

          echo "=== Updating symlink ==="
          ln -sfn "${BUILD_DIR}/bundle" "$HOME/Builds/current"

          echo "=== Restarting service ==="
          sudo systemctl restart mieauth

          echo "=== Health check ==="
          sleep 10
          if sudo systemctl is-active --quiet mieauth; then
            echo "Server deployed and running successfully"
            sudo systemctl status mieauth --no-pager
          else
            echo "Server failed to start"
            sudo journalctl -u mieauth --no-pager -n 50
            exit 1
          fi

          echo "=== Cleaning up old builds (keeping latest 3) ==="
          cd "$HOME/Builds"
          ls -dt Webserver-build-* 2>/dev/null | tail -n +4 | while read old_build; do
            echo "Removing old build: ${old_build}"
            rm -rf "${old_build}"
          done

      - name: Verify Server Health (HTTP)
        run: |
          for i in 1 2 3 4 5; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${SERVER_URL}" || echo "000")
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "Server responding with HTTP ${HTTP_STATUS}"
              exit 0
            fi
            echo "Attempt ${i}: HTTP ${HTTP_STATUS}, retrying in 10s..."
            sleep 10
          done
          echo "Server not responding after 5 attempts"
          echo "If this is HTTP 502, check the Cloudflare tunnel public hostname"
          echo "maps ${SERVER_HOST} to HTTP localhost:3000."
          exit 1

  # ─────────────────────────────────────────────
  # Mobile — shared mieweb/actions pipeline.
  # pre_build_script rebrands the checkout as MIEWeb Auth before
  # Meteor runs, so mobile-config.js stays opensource in git.
  # ─────────────────────────────────────────────
  mobile:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.build_mobile == 'true' }}
    uses: mieweb/actions/.github/workflows/build-mobile-from-meteor.yml@v2.3.0
    # Mapped explicitly, NOT `secrets: inherit` — the unprefixed names belong to
    # the opensource app, so inheriting would sign MIEWeb Auth with its keystore
    # and certificate.
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.MIE_ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MIE_ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.MIE_ANDROID_KEYSTORE_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.MIE_ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_JSON_KEY_BASE64: ${{ secrets.MIE_GOOGLE_PLAY_JSON_KEY_BASE64 }}
      GOOGLE_SERVICES_BASE64: ${{ secrets.MIE_FIREBASE_SERVICES_JSON_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.MIE_APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.MIE_APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.MIE_APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.MIE_APPLE_API_KEY_P8_BASE64 }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.MIE_IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.MIE_IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MIE_IOS_PROVISIONING_PROFILE_BASE64 }}
    with:
      platforms: ${{ needs.prepare.outputs.platforms }}
      meteor_server: https://mieauth.mieweb.org
      ios_app_identifier: org.mieweb.auth
      android_app_identifier: org.mieweb.auth
      # Explicit cert + profile from secrets; 'match' would need a shared
      # certificates repo this app is not enrolled in.
      ios_signing_mode: secrets
      android_signing_method: direct-keystore
      android_build_type: bundle
      pre_build_script: |
        APP_VERSION="${{ needs.prepare.outputs.app_version }}" \
          bash scripts/apply-mieweb-variant.sh
      upload_to_testflight: ${{ needs.prepare.outputs.publish == 'true' }}
      upload_to_play: ${{ needs.prepare.outputs.publish == 'true' }}
      play_track: internal
